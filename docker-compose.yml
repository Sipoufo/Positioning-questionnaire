# docker-compose.yml
# Two services published on localhost only — the host's Nginx (already running
# for printmarksgraphics.cloud) reverse-proxies /happycash/ to them.
#
#   - web : built React SPA served by Nginx on host port 8080 (loopback only)
#   - api : Express backend on host port 3001 (loopback only)
#
# Override the bound ports via .env (WEB_HOST_PORT / API_HOST_PORT) if these
# values collide with something else on the VPS.

services:
  web:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_DEADLINE_ISO: ${VITE_DEADLINE_ISO:-}
    image: hc-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8080}:80"
    networks: [hc]

  api:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    image: hc-api:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"
    networks: [hc]

networks:
  hc:
    driver: bridge
