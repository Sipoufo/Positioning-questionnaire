# nginx-proxy-manager.advanced.conf
# Paste this verbatim into the "Advanced" tab of the Proxy Host for
# `printmarksgraphics.cloud` in Nginx Proxy Manager (NPM).
#
# Why the Advanced tab instead of "Custom locations":
# NPM's Custom Locations UI generates `proxy_pass http://host:port` WITHOUT
# a trailing slash, so the `/happycash/` prefix leaks to the upstream and the
# SPA container Nginx returns 404. Putting the locations in the Advanced tab
# lets us write the trailing slash on proxy_pass — Nginx then strips the
# prefix and forwards `/index.html` to our SPA, `/api/submit` to our API.
#
# Container names must match the ones in docker-compose.yml: `hc-web`, `hc-api`.

# --- Happy Cash positioning questionnaire ------------------------------------

# API — MUST come before the SPA location so it matches first.
# Browser request  : https://printmarksgraphics.cloud/happycash/api/submit
# Upstream receives: /api/submit  (the /happycash prefix is stripped)
location /happycash/api/ {
    proxy_pass http://hc-api:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
}

# SPA — strip the /happycash/ prefix when proxying.
location /happycash/ {
    proxy_pass http://hc-web:80/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Redirect /happycash (no trailing slash) -> /happycash/
location = /happycash {
    return 301 /happycash/;
}

# --- End Happy Cash ----------------------------------------------------------
