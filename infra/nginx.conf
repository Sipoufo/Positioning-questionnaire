# nginx.conf
# SPA static server. Falls back to index.html for client-side routing. Caching
# is aggressive on hashed assets and disabled on index.html to avoid stale UIs.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed assets (Vite outputs hashes in filenames).
  location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # No cache on index.html — clients always pick up the latest bundle.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
