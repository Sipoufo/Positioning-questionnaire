# nginx-host.example.conf
# Snippet to add INSIDE the existing `server { ... }` block on the VPS that
# already serves https://printmarksgraphics.cloud/ (the other project).
#
# Do NOT replace the existing file — just paste these three location blocks
# alongside the ones already there. After saving, run:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Assumes Docker exposes:
#   - web (SPA Nginx) on 127.0.0.1:8080
#   - api (Express)   on 127.0.0.1:3001
# Adjust the ports if you changed WEB_HOST_PORT / API_HOST_PORT in .env.

# --- Happy Cash positioning questionnaire ------------------------------------

# API — must come BEFORE the SPA location so it matches first.
# Browser requests /happycash/api/submit → upstream gets /api/submit.
location /happycash/api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Submission payload is small; keep upload limits tight.
    client_max_body_size 256k;

    # Honest upstream timeouts (PDF + SMTP can take a few seconds).
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
}

# SPA — strip the /happycash/ prefix when proxying to the container Nginx.
# Trailing slash matters in both `location` and `proxy_pass` for prefix stripping.
location /happycash/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Make sure /happycash (without trailing slash) redirects to /happycash/.
location = /happycash {
    return 301 /happycash/;
}

# --- End Happy Cash ----------------------------------------------------------
